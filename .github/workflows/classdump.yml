# Class-dump SpringBoard / CarPlay / cac framework lien quan tu IPSW iOS 16.5 (iPhone SE 2020)
# Chay tren macOS runner (co hdiutil de mount APFS). Ket qua commit vao thu muc headers/.
name: Class-dump iOS 16.5 (iPhone12,8)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/classdump.yml

permissions:
  contents: write

env:
  IPSW_URL: https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-85464/B29DC12A-DA65-4CBA-BB13-DBFDAC9BEA73/iPhone12,8_16.5_20F66_Restore.ipsw

jobs:
  classdump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ipsw
        run: brew install blacktop-tap/tap/ipsw

      - name: Extract binaries from root FS (remote)
        run: |
          mkdir -p /tmp/fs
          ipsw extract --remote --files --flat -o /tmp/fs \
            --pattern 'CoreServices/(SpringBoard|CarPlay)\.app/(SpringBoard|CarPlay)$' "$IPSW_URL"
          find /tmp/fs -type f -exec ls -la {} \;

      - name: Extract dyld_shared_cache (remote)
        run: |
          mkdir -p /tmp/dsc
          ipsw extract --remote --dyld --dyld-arch arm64e -o /tmp/dsc "$IPSW_URL"
          find /tmp/dsc -name 'dyld_shared_cache_arm64e' -exec ls -la {} \;

      - name: Class-dump
        run: |
          set -x
          DSC=$(find /tmp/dsc -name 'dyld_shared_cache_arm64e' | head -1)
          SB=$(find /tmp/fs -type f -name SpringBoard | head -1)
          CP=$(find /tmp/fs -type f -name CarPlay | head -1)
          rm -rf headers && mkdir -p headers
          ipsw class-dump "$SB" --headers -o headers/SpringBoard
          ipsw class-dump "$CP" --headers -o headers/CarPlay
          for FW in \
            /System/Library/PrivateFrameworks/CarPlayUIServices.framework/CarPlayUIServices \
            /System/Library/PrivateFrameworks/CarPlaySupport.framework/CarPlaySupport \
            /System/Library/PrivateFrameworks/CarKit.framework/CarKit \
            /System/Library/PrivateFrameworks/FrontBoardServices.framework/FrontBoardServices \
            /System/Library/PrivateFrameworks/FrontBoard.framework/FrontBoard \
            /System/Library/PrivateFrameworks/SpringBoardUI.framework/SpringBoardUI \
            /System/Library/PrivateFrameworks/SpringBoardFoundation.framework/SpringBoardFoundation ; do
            NAME=$(basename "$FW")
            ipsw class-dump "$DSC" "$FW" --headers -o "headers/$NAME" || echo "skip $NAME"
          done
          # UIKitCore qua lon -> chi lay cac class can
          ipsw class-dump "$DSC" /System/Library/PrivateFrameworks/UIKitCore.framework/UIKitCore \
            --class '^(UIRootSceneWindow|UIWindow|UIScreen|_UIRootWindow|UIWindowScene|_UISceneHostingView|UIApplication)$' \
            > headers/UIKitCore-selected.txt || true
          ipsw class-dump "$DSC" /System/Library/Frameworks/AVFoundation.framework/AVFoundation \
            --class '^AVExternalDevice$' > headers/AVExternalDevice.txt || true
          ipsw class-dump "$DSC" /System/Library/Frameworks/QuartzCore.framework/QuartzCore \
            --class '^CADisplay$' > headers/CADisplay.txt || true
          du -sh headers/*

      - name: Commit headers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add headers
          git commit -m "Add class-dump headers for iOS 16.5 20F66 (iPhone12,8)" || echo "nothing to commit"
          git push
