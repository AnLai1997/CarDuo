<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- CarDuo: two split panes on a transparent background (CarPlay green) -->
  <defs>
    <linearGradient id="cp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EE86A"/>
      <stop offset="1" stop-color="#0FB51E"/>
    </linearGradient>
    <linearGradient id="cpdark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2CC852"/>
      <stop offset="1" stop-color="#06862E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06401A" flood-opacity=".3"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="82" y="186" width="532" height="652" rx="132" fill="#fff"/>
    <rect x="634" y="186" width="308" height="652" rx="118" fill="#fff"/>
  </g>
  <rect x="96" y="200" width="504" height="624" rx="118" fill="url(#cp)"/>
  <rect x="96" y="200" width="504" height="624" rx="118" fill="url(#sheen)"/>
  <rect x="648" y="200" width="280" height="624" rx="104" fill="url(#cpdark)"/>
  <rect x="648" y="200" width="280" height="624" rx="104" fill="url(#sheen)"/>
  <path d="M348 370 L441 637 L348 583 L255 637 Z" fill="#fff"/>
  <g fill="#fff">
    <rect x="695" y="447" width="46" height="130" rx="23"/>
    <rect x="765" y="387" width="46" height="250" rx="23"/>
    <rect x="835" y="427" width="46" height="170" rx="23"/>
  </g>
</svg>
